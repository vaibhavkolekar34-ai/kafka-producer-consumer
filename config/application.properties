# Set this to the EC2 broker address when the application is deployed to EC2.
kafka.bootstrap.servers=localhost:9092
kafka.topic=performance-test

# Use a new value for every benchmark run. The consumer accepts only this run's records.
test.run.id=baseline-001
test.message.count=50000
test.result.directory=results

producer.batch.size=16384
producer.linger.ms=0
producer.compression.type=none
producer.acks=all

# Use a different group ID for each run or leave this value unchanged: records are filtered by test.run.id.
consumer.group.id=performance-test-group
consumer.auto.offset.reset=earliest
consumer.enable.auto.commit=false
consumer.poll.timeout.ms=1000
consumer.max.wait.seconds=300
